<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goleiro — Segregação de Rotas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo h1 { font-size: 1.2rem; font-weight: 700; color: #0f172a; }
    .logo .sub { font-size: .78rem; color: #94a3b8; margin-top: 1px; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .78rem; font-weight: 600;
      padding: 5px 14px; border-radius: 999px;
    }
    .badge.loading { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .badge.ready   { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge.error   { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .dot.pulse { animation: pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── Main ── */
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── Result card ── */
    .result-card {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      min-height: 195px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 28px 32px;
      text-align: center;
      transition: all .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .result-card.found {
      background: #f0fdf4;
      border-color: #16a34a;
      box-shadow: 0 0 0 4px rgba(22,163,74,.07), 0 4px 16px rgba(22,163,74,.1);
    }
    .result-card.sem-rota {
      background: #fef2f2;
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(220,38,38,.07), 0 4px 16px rgba(220,38,38,.1);
    }
    .result-label {
      font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px; color: #94a3b8;
    }
    .result-card.found    .result-label { color: #16a34a; }
    .result-card.sem-rota .result-label { color: #dc2626; }
    .result-route {
      font-size: 4.5rem; font-weight: 900;
      line-height: 1; letter-spacing: -1px; color: #0f172a;
      word-break: break-all;
    }
    .result-card.found    .result-route { color: #16a34a; }
    .result-card.sem-rota .result-route { color: #dc2626; }
    .result-id {
      font-family: monospace; font-size: .9rem; color: #64748b;
      background: #f1f5f9; padding: 3px 10px; border-radius: 6px;
    }
    .result-ciclo {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .78rem; font-weight: 700;
    }
    .idle-icon { font-size: 3rem; }
    .idle-msg  { font-size: 1.25rem; color: #94a3b8; }

    /* ── Scan row ── */
    .scan-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .scan-wrap { flex: 1; min-width: 240px; position: relative; }
    .scan-ico {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #94a3b8; font-size: 1.1rem; pointer-events: none;
    }
    .scan-input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      font-size: 1.1rem; font-family: monospace;
      background: #fff; border: 2px solid #e2e8f0;
      border-radius: 12px; color: #0f172a; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .scan-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }

    .btn {
      padding: 14px 18px;
      background: #fff; border: 2px solid #e2e8f0;
      border-radius: 12px; color: #475569;
      font-size: .88rem; font-weight: 600;
      cursor: pointer; transition: all .18s;
      display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap;
    }
    .btn:hover { border-color: #3b82f6; color: #1d4ed8; background: #eff6ff; }
    .btn.green { background: #16a34a; border-color: #16a34a; color: #fff; }
    .btn.green:hover { background: #15803d; border-color: #15803d; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .stat {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 12px; padding: 18px 16px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .stat-n { font-size: 2.4rem; font-weight: 800; line-height: 1; }
    .stat-n.blue  { color: #2563eb; }
    .stat-n.green { color: #16a34a; }
    .stat-n.red   { color: #dc2626; }
    .stat-n.gray  { color: #64748b; }
    .stat-l {
      font-size: .68rem; color: #94a3b8;
      text-transform: uppercase; letter-spacing: .5px;
      margin-top: 4px; font-weight: 600;
    }

    /* ── Two-column ── */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ── Panel ── */
    .panel {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .panel-head {
      padding: 13px 18px; border-bottom: 1px solid #f1f5f9;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .panel-title {
      font-size: .78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .5px; color: #64748b;
    }
    .panel-body { overflow-y: auto; max-height: 340px; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; }
    .tab {
      padding: 4px 12px; border-radius: 999px;
      font-size: .76rem; font-weight: 600;
      cursor: pointer; border: 1px solid transparent;
      color: #64748b; background: none;
      transition: all .15s;
    }
    .tab:hover { background: #f1f5f9; }
    .tab.active { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }

    /* ── Route table ── */
    .rt { width: 100%; border-collapse: collapse; }
    .rt th {
      text-align: left; padding: 9px 16px;
      font-size: .68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px;
      color: #94a3b8; background: #f8fafc;
      border-bottom: 1px solid #f1f5f9;
      position: sticky; top: 0;
    }
    .rt th:last-child { text-align: right; }
    .rt td { padding: 9px 16px; font-size: .88rem; border-bottom: 1px solid #f8fafc; }
    .rt td:last-child { text-align: right; }
    .rt tr:hover td { background: #f8fafc; }
    .rt .empty td { text-align: center; color: #94a3b8; padding: 28px 16px; }

    .pill-ciclo {
      display: inline-block; padding: 2px 9px;
      border-radius: 999px; font-size: .7rem; font-weight: 700;
    }
    .pill-ciclo.am { background: #dbeafe; color: #1d4ed8; }
    .pill-ciclo.pm { background: #fef3c7; color: #a16207; }
    .pill-ciclo.nd { background: #f1f5f9; color: #64748b; }

    .pill-count {
      display: inline-block; padding: 2px 10px;
      background: #dcfce7; color: #15803d;
      font-weight: 700; font-size: .82rem;
      border-radius: 999px;
    }

    /* ── History ── */
    .hist-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; border-bottom: 1px solid #f8fafc;
      transition: background .1s;
    }
    .hist-item:hover { background: #f8fafc; }
    .hdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .hdot.g { background: #16a34a; }
    .hdot.r { background: #dc2626; }
    .hist-id   { font-family: monospace; font-size: .83rem; color: #64748b; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hist-rota { font-weight: 700; font-size: .85rem; white-space: nowrap; }
    .hist-item.found    .hist-rota { color: #16a34a; }
    .hist-item.sem-rota .hist-rota { color: #dc2626; }
    .hist-time { font-size: .7rem; color: #94a3b8; white-space: nowrap; }
    .hist-empty { text-align: center; padding: 32px 16px; color: #94a3b8; font-size: .9rem; }

    .info-line { font-size: .74rem; color: #94a3b8; text-align: center; }

    @media (max-width: 820px) {
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .result-route { font-size: 2.8rem; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      header { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span style="font-size:1.7rem">🥅</span>
    <div>
      <h1>Goleiro — Segregação de Rotas</h1>
      <div class="sub">SMG15 · Estação de segregação final</div>
    </div>
  </div>
  <div id="badge" class="badge loading">
    <div class="dot pulse"></div>
    <span id="badgeText">Carregando...</span>
  </div>
</header>

<main>

  <!-- Result -->
  <div id="card" class="result-card">
    <div class="idle-icon">📦</div>
    <div class="idle-msg">Aguardando bipagem...</div>
  </div>

  <!-- Scan row -->
  <div class="scan-row">
    <div class="scan-wrap">
      <span class="scan-ico">📷</span>
      <input id="inp" class="scan-input" type="text"
             placeholder="Bipe o pacote aqui (Enter para confirmar)..."
             autocomplete="off" autocorrect="off" spellcheck="false" />
    </div>
    <button class="btn" onclick="loadSheet()">↺ Atualizar base</button>
    <button class="btn green" onclick="downloadCSV()">↓ Baixar bipagens</button>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat"><div id="sTotal"   class="stat-n blue">0</div><div class="stat-l">Total Bipados</div></div>
    <div class="stat"><div id="sFound"   class="stat-n green">0</div><div class="stat-l">Com Rota</div></div>
    <div class="stat"><div id="sNoRoute" class="stat-n red">0</div><div class="stat-l">Sem Rota</div></div>
    <div class="stat"><div id="sBase"    class="stat-n gray">0</div><div class="stat-l">Na Base</div></div>
  </div>

  <!-- Two columns -->
  <div class="two-col">

    <!-- Route counts -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">📊 Pacotes por rota OT</span>
        <div class="tabs">
          <button class="tab active" data-tab="todos"  onclick="setTab(this)">Todos</button>
          <button class="tab"        data-tab="am"     onclick="setTab(this)">AM</button>
          <button class="tab"        data-tab="pm"     onclick="setTab(this)">PM</button>
        </div>
      </div>
      <div class="panel-body">
        <table class="rt">
          <thead>
            <tr><th>Rota OT</th><th>Ciclo</th><th>Qtd</th></tr>
          </thead>
          <tbody id="routeBody">
            <tr class="empty"><td colspan="3">Nenhum pacote bipado</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- History -->
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">📋 Histórico da sessão</span>
        <button class="btn" style="padding:5px 12px;font-size:.78rem" onclick="clearSession()">Limpar</button>
      </div>
      <div id="histList" class="panel-body">
        <div class="hist-empty">Nenhuma bipagem ainda</div>
      </div>
    </div>

  </div>

  <div id="infoLine" class="info-line">—</div>

</main>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const SHEET_ID  = '1hRVnx-G2Kw_ZoHYzCGyju914PrB2fGIKZgSHIjm8GxE';
  const GID       = '1012863278';
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

  // ── State ─────────────────────────────────────────────────────────────────
  let routeMap    = new Map();   // PACOTES_ID → { rotaOT, ciclo }
  let routeCounts = new Map();   // rotaOT → { total, ciclo }
  let sessionLog  = [];
  let loaded      = false;
  let clearTimer  = null;
  let activeTab   = 'todos';
  let stats = { total: 0, found: 0, noRoute: 0 };

  // ── Audio ─────────────────────────────────────────────────────────────────
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  function tone(f, d, type = 'sine', v = .28) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = type;
    o.frequency.setValueAtTime(f, actx.currentTime);
    g.gain.setValueAtTime(v, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + d);
    o.start(); o.stop(actx.currentTime + d);
  }
  function beepOk()   { tone(880, .1); setTimeout(() => tone(1100, .18), 100); }
  function beepFail() { tone(260, .35, 'sawtooth', .3); }

  // ── CSV parser ────────────────────────────────────────────────────────────
  function parseCSV(text) {
    const rows = [];
    for (const raw of text.split('\n')) {
      if (!raw.trim()) continue;
      const row = []; let cell = '', inQ = false;
      for (let i = 0; i < raw.length; i++) {
        const c = raw[i];
        if (c === '"') { if (inQ && raw[i+1] === '"') { cell += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { row.push(cell.trim()); cell = ''; }
        else cell += c;
      }
      row.push(cell.trim()); rows.push(row);
    }
    return rows;
  }

  function detectCiclo(rotaOT) {
    if (!rotaOT) return '';
    const u = rotaOT.toUpperCase();
    if (u.includes('_AM') || /^AM\d/i.test(rotaOT)) return 'AM';
    if (u.includes('_PM') || /^PM\d/i.test(rotaOT)) return 'PM';
    return '';
  }

  // ── Load sheet ────────────────────────────────────────────────────────────
  async function loadSheet() {
    setBadge('loading', 'Carregando...');
    try {
      const res  = await fetch(SHEET_URL + '&_=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = parseCSV(await res.text());
      if (rows.length < 2) throw new Error('Aba sem dados');

      const hdr     = rows[0];
      const iID     = hdr.findIndex(h => h === 'PACOTES_ID');
      const iRotaOT = hdr.findIndex(h => h === 'ROTA OT');
      if (iID < 0)     throw new Error('Coluna PACOTES_ID não encontrada');
      if (iRotaOT < 0) throw new Error('Coluna ROTA OT não encontrada');

      routeMap.clear();
      for (let i = 1; i < rows.length; i++) {
        const r  = rows[i];
        const id = r[iID]?.trim();
        if (!id || id === '0') continue;
        const rotaOT = r[iRotaOT]?.trim() || '';
        routeMap.set(id, { rotaOT, ciclo: detectCiclo(rotaOT) });
      }

      loaded = true;
      const t = new Date().toLocaleTimeString('pt-BR');
      setBadge('ready', `Pronto — ${routeMap.size} registros`);
      el('sBase').textContent    = routeMap.size;
      el('infoLine').textContent = `Base carregada às ${t} · ${routeMap.size} pacotes na aba goleiro · atualiza automaticamente a cada 5 min`;
    } catch (e) {
      loaded = false;
      setBadge('error', 'Erro ao carregar');
      el('infoLine').textContent = `Falha: ${e.message}. Verifique se a planilha está pública.`;
    }
    focus();
  }

  // ── Scan ─────────────────────────────────────────────────────────────────
  function scan(raw) {
    const id = raw.trim();
    if (!id) return;
    if (!loaded) { alert('Aguarde — base ainda carregando.'); return; }

    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
    stats.total++;
    el('sTotal').textContent = stats.total;

    const entry = routeMap.get(id);
    if (entry) {
      const { rotaOT, ciclo } = entry;
      const label = rotaOT || 'SEM ROTA';
      const found = !!rotaOT;
      showCard(id, label, ciclo, found);
      logEntry(id, label, ciclo, found);
      if (found) {
        stats.found++;
        el('sFound').textContent = stats.found;
        const prev = routeCounts.get(rotaOT) || { count: 0, ciclo };
        routeCounts.set(rotaOT, { count: prev.count + 1, ciclo });
        renderRouteTable();
        beepOk();
      } else {
        stats.noRoute++;
        el('sNoRoute').textContent = stats.noRoute;
        beepFail();
      }
    } else {
      showCard(id, 'SEM ROTA', '', false);
      logEntry(id, 'SEM ROTA', '', false);
      stats.noRoute++;
      el('sNoRoute').textContent = stats.noRoute;
      beepFail();
    }

    clearTimer = setTimeout(resetCard, 5000);
  }

  // ── Card ──────────────────────────────────────────────────────────────────
  function showCard(id, rota, ciclo, found) {
    const card  = el('card');
    const cls   = found ? 'found' : 'sem-rota';
    const lbl   = found ? '✅ Rota Identificada' : '❌ Sem Rota Definida';
    const cicloHtml = ciclo
      ? `<span class="result-ciclo"><span class="pill-ciclo ${ciclo.toLowerCase()}">${ciclo}</span></span>`
      : '';
    card.className = `result-card ${cls}`;
    card.innerHTML = `
      <div class="result-label">${lbl}</div>
      <div class="result-route">${esc(rota)}</div>
      ${cicloHtml}
      <div class="result-id">ID: ${esc(id)}</div>
    `;
  }

  function resetCard() {
    el('card').className = 'result-card';
    el('card').innerHTML = '<div class="idle-icon">📦</div><div class="idle-msg">Aguardando bipagem...</div>';
  }

  // ── Route table ───────────────────────────────────────────────────────────
  function setTab(btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    renderRouteTable();
  }

  function renderRouteTable() {
    const body = el('routeBody');
    const entries = [...routeCounts.entries()]
      .filter(([, v]) => {
        if (activeTab === 'todos') return true;
        return v.ciclo.toLowerCase() === activeTab;
      })
      .sort((a, b) => b[1].count - a[1].count);

    if (!entries.length) {
      body.innerHTML = '<tr class="empty"><td colspan="3">Nenhum pacote bipado</td></tr>';
      return;
    }

    body.innerHTML = entries.map(([rota, v]) => {
      const c = v.ciclo || 'ND';
      const pillClass = c === 'AM' ? 'am' : c === 'PM' ? 'pm' : 'nd';
      return `<tr>
        <td style="font-weight:700">${esc(rota)}</td>
        <td><span class="pill-ciclo ${pillClass}">${c}</span></td>
        <td><span class="pill-count">${v.count}</span></td>
      </tr>`;
    }).join('');
  }

  // ── History / Log ─────────────────────────────────────────────────────────
  function logEntry(id, rota, ciclo, found) {
    sessionLog.unshift({
      id, rota, ciclo, found,
      time: new Date().toLocaleTimeString('pt-BR'),
      ts:   new Date().toISOString()
    });
    if (sessionLog.length > 200) sessionLog.pop();
    renderHistory();
  }

  function renderHistory() {
    const list = el('histList');
    if (!sessionLog.length) {
      list.innerHTML = '<div class="hist-empty">Nenhuma bipagem ainda</div>';
      return;
    }
    list.innerHTML = sessionLog.map(h => `
      <div class="hist-item ${h.found ? 'found' : 'sem-rota'}">
        <div class="hdot ${h.found ? 'g' : 'r'}"></div>
        <span class="hist-id">${esc(h.id)}</span>
        <span class="hist-rota">${esc(h.rota)}</span>
        <span class="hist-time">${h.time}</span>
      </div>
    `).join('');
  }

  function clearSession() {
    sessionLog = []; routeCounts.clear();
    stats = { total: 0, found: 0, noRoute: 0 };
    ['sTotal','sFound','sNoRoute'].forEach(id => el(id).textContent = '0');
    renderHistory(); renderRouteTable(); resetCard();
  }

  // ── Download ──────────────────────────────────────────────────────────────
  function downloadCSV() {
    if (!sessionLog.length) { alert('Nenhuma bipagem para baixar.'); return; }
    const header = 'Horário,PACOTES_ID,ROTA OT,Ciclo,Status';
    const rows   = sessionLog.map(h =>
      [h.ts, h.id, h.rota, h.ciclo || '—', h.found ? 'Com Rota' : 'Sem Rota'].join(',')
    );
    const blob = new Blob(['﻿' + header + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = `goleiro_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  const el  = id => document.getElementById(id);
  const esc = s  => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function setBadge(type, text) {
    const b = el('badge');
    b.className = `badge ${type}`;
    b.querySelector('.dot').className = `dot${type === 'loading' ? ' pulse' : ''}`;
    el('badgeText').textContent = text;
  }
  function focus() { const i = el('inp'); i.focus(); i.select(); }

  // ── Events ────────────────────────────────────────────────────────────────
  el('inp').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const v = e.target.value;
    e.target.value = '';
    scan(v);
  });
  document.addEventListener('click', e => { if (e.target !== el('inp')) focus(); });

  // ── Boot ──────────────────────────────────────────────────────────────────
  window.addEventListener('load', () => {
    focus();
    loadSheet();
    setInterval(loadSheet, 5 * 60 * 1000);
  });
</script>
</body>
</html>
